#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M
#Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true
#Android
android.nonTransitiveRClass=true
android.useAndroidX=true
# AGP 9.0+ no longer allows com.android.application directly inside a
# kotlin.multiplatform module (see the plugin's own deprecation notice) -
# these fall back to the pre-9.0 behavior rather than splitting this module
# into a separate Android-application subproject right now.
android.builtInKotlin=false
android.newDsl=false